name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no AI co-author trailers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor / Claude co-author trailers (REQ-GIT-001)
        run: sh .scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.2' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        if: matrix.php != '8.2'
        run: vendor/bin/phpunit --no-coverage

      - name: Run tests with coverage (100% lines and methods required, REQ-TEST-003)
        if: matrix.php == '8.2'
        run: |
          vendor/bin/phpunit --coverage-text --coverage-clover coverage.xml
          php -r '$m = simplexml_load_file("coverage.xml")->project->metrics; $s = (int) $m["statements"]; $cs = (int) $m["coveredstatements"]; $me = (int) $m["methods"]; $cm = (int) $m["coveredmethods"]; echo "lines $cs/$s, methods $cm/$me\n"; exit($s > 0 && $cs === $s && $cm === $me ? 0 : 1);'

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Rector (dry run)
        run: composer rector-dry

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

      - name: Composer audit
        run: composer audit

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
